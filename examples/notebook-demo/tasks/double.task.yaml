title: Функция Удвоить
statement: |
  ## Функция Удвоить

  Напиши функцию `Удвоить(х)`, которая возвращает удвоенное значение.
starter: |
  Функция Удвоить(х)
      //<<
      // допиши тело
      //>>
  КонецФункции
tests:
  - kind: call
    invoke: "Удвоить(5)"
    expect: "10"
  - kind: call
    invoke: "Удвоить(0)"
    expect: "0"
    hidden: true
hints:
  - Используй `Возврат х * 2`.
