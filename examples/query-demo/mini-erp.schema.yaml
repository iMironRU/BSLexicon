# Учебная демо-схема для песочницы языка запросов 1С
# Мини-ERP: пять справочников/документов + регистр накопления + регистр сведений.
# Достаточно для базовых курсов SELECT/JOIN/GROUP BY/агрегаты/виртуальные таблицы.
#
# Формат — docs/query-sandbox/README.md §4.2, JSON Schema — schema-format.json.

version: 1

tables:
  # ── Справочники ─────────────────────────────────────────────────

  - kind: Справочник
    name: Номенклатура
    hierarchical: true
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(150) }
      - { name: Родитель, type: Ссылка, refs: Справочник.Номенклатура }
      - { name: ПометкаУдаления, type: Булево }

  - kind: Справочник
    name: Контрагенты
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(150) }
      - { name: ИНН, type: Строка(12) }
      - { name: ПометкаУдаления, type: Булево }

  - kind: Справочник
    name: Склады
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(50) }
      - { name: ПометкаУдаления, type: Булево }

  # ── Документ ────────────────────────────────────────────────────

  - kind: Документ
    name: РасходнаяНакладная
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Номер, type: Строка(11) }
      - { name: Дата, type: Дата }
      - { name: Контрагент, type: Ссылка, refs: Справочник.Контрагенты }
      - { name: Склад, type: Ссылка, refs: Справочник.Склады }
      - { name: Проведён, type: Булево }
    tabular:
      - name: Товары
        fields:
          - { name: Номенклатура, type: Ссылка, refs: Справочник.Номенклатура }
          - { name: Количество, type: "Число(15,3)" }
          - { name: Цена, type: "Число(15,2)" }
          - { name: Сумма, type: "Число(15,2)" }

  # ── Регистры ────────────────────────────────────────────────────

  # Регистр накопления «Остатки» — стандартный склад с ВидДвижения
  # (Приход/Расход). Движения формируются документом РасходнаяНакладная.
  - kind: РегистрНакопления
    name: ОстаткиТоваров
    view: Остатки
    dimensions:
      - { name: Склад, type: Ссылка, refs: Справочник.Склады }
      - { name: Номенклатура, type: Ссылка, refs: Справочник.Номенклатура }
    resources:
      - { name: Количество, type: "Число(15,3)" }
      - { name: Сумма, type: "Число(15,2)" }

  # Регистр сведений — периодические цены. Для типового учебного
  # сценария: «взять цену на дату документа» через СрезПоследних.
  - kind: РегистрСведений
    name: ЦеныНоменклатуры
    periodic: true
    dimensions:
      - { name: Номенклатура, type: Ссылка, refs: Справочник.Номенклатура }
    resources:
      - { name: Цена, type: "Число(15,2)" }
