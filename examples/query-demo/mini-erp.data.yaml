# Тестовые данные под mini-erp.schema.yaml.
# Достаточно чтобы ученик мог написать запросы с JOIN, GROUP BY, агрегатами,
# `В ИЕРАРХИИ`, виртуальными таблицами Остатки/Обороты/СрезПоследних.
#
# Ссылки — по короткому id (n1, k1, s1, d1). Тренажёр под капотом резолвит
# их к записям соответствующей таблицы.

version: 1

records:

  # ── Справочник.Номенклатура ────────────────────────────────────

  Справочник.Номенклатура:
    # Иерархия: группы «Инструмент», «Метизы» + позиции внутри
    - { Ссылка: n_grp_tool, Код: "000000001", Наименование: "Инструмент", Родитель: null, ПометкаУдаления: false }
    - { Ссылка: n_grp_met,  Код: "000000002", Наименование: "Метизы",     Родитель: null, ПометкаУдаления: false }
    - { Ссылка: n1, Код: "000000003", Наименование: "Молоток",     Родитель: n_grp_tool, ПометкаУдаления: false }
    - { Ссылка: n2, Код: "000000004", Наименование: "Отвёртка",    Родитель: n_grp_tool, ПометкаУдаления: false }
    - { Ссылка: n3, Код: "000000005", Наименование: "Пила",        Родитель: n_grp_tool, ПометкаУдаления: false }
    - { Ссылка: n4, Код: "000000006", Наименование: "Саморез 3.5", Родитель: n_grp_met,  ПометкаУдаления: false }
    - { Ссылка: n5, Код: "000000007", Наименование: "Гвоздь 100",  Родитель: n_grp_met,  ПометкаУдаления: false }
    - { Ссылка: n6, Код: "000000008", Наименование: "Устаревшая позиция", Родитель: n_grp_met, ПометкаУдаления: true }

  # ── Справочник.Контрагенты ─────────────────────────────────────

  Справочник.Контрагенты:
    - { Ссылка: k1, Код: "000000001", Наименование: "ООО «Стройка»",  ИНН: "7701234567", ПометкаУдаления: false }
    - { Ссылка: k2, Код: "000000002", Наименование: "ИП Петров",       ИНН: "770212345678", ПометкаУдаления: false }
    - { Ссылка: k3, Код: "000000003", Наименование: "ЗАО «Ремонт+»",   ИНН: "7703456789", ПометкаУдаления: false }

  # ── Справочник.Склады ──────────────────────────────────────────

  Справочник.Склады:
    - { Ссылка: s_main, Код: "000000001", Наименование: "Основной",   ПометкаУдаления: false }
    - { Ссылка: s_east, Код: "000000002", Наименование: "Восточный",  ПометкаУдаления: false }

  # ── Документ.РасходнаяНакладная ────────────────────────────────

  Документ.РасходнаяНакладная:
    - Ссылка: d1
      Номер: "0000000001"
      Дата: "2024-01-15T10:00:00"
      Контрагент: k1
      Склад: s_main
      Проведён: true
      Товары:
        - { Номенклатура: n1, Количество: 5,  Цена: 500,  Сумма: 2500 }
        - { Номенклатура: n2, Количество: 3,  Цена: 150,  Сумма: 450 }
        - { Номенклатура: n4, Количество: 200, Цена: 3,   Сумма: 600 }

    - Ссылка: d2
      Номер: "0000000002"
      Дата: "2024-02-01T14:30:00"
      Контрагент: k2
      Склад: s_main
      Проведён: true
      Товары:
        - { Номенклатура: n3, Количество: 2, Цена: 1200, Сумма: 2400 }
        - { Номенклатура: n5, Количество: 500, Цена: 2, Сумма: 1000 }

    - Ссылка: d3
      Номер: "0000000003"
      Дата: "2024-03-10T09:00:00"
      Контрагент: k1
      Склад: s_east
      Проведён: true
      Товары:
        - { Номенклатура: n1, Количество: 10, Цена: 520, Сумма: 5200 }

    - Ссылка: d4
      Номер: "0000000004"
      Дата: "2024-03-15T11:00:00"
      Контрагент: k3
      Склад: s_main
      Проведён: false
      Товары:
        - { Номенклатура: n2, Количество: 7, Цена: 150, Сумма: 1050 }

  # ── РегистрНакопления.ОстаткиТоваров ──────────────────────────
  #
  # Расход движется от РасходнаяНакладная (только проведённые).
  # ВидДвижения: Приход / Расход. Тут — только Расход.

  РегистрНакопления.ОстаткиТоваров:
    - { Период: "2024-01-15T10:00:00", Регистратор: "Документ.РасходнаяНакладная:d1", ВидДвижения: Расход, Склад: s_main, Номенклатура: n1, Количество: 5,   Сумма: 2500 }
    - { Период: "2024-01-15T10:00:00", Регистратор: "Документ.РасходнаяНакладная:d1", ВидДвижения: Расход, Склад: s_main, Номенклатура: n2, Количество: 3,   Сумма: 450 }
    - { Период: "2024-01-15T10:00:00", Регистратор: "Документ.РасходнаяНакладная:d1", ВидДвижения: Расход, Склад: s_main, Номенклатура: n4, Количество: 200, Сумма: 600 }
    - { Период: "2024-02-01T14:30:00", Регистратор: "Документ.РасходнаяНакладная:d2", ВидДвижения: Расход, Склад: s_main, Номенклатура: n3, Количество: 2,   Сумма: 2400 }
    - { Период: "2024-02-01T14:30:00", Регистратор: "Документ.РасходнаяНакладная:d2", ВидДвижения: Расход, Склад: s_main, Номенклатура: n5, Количество: 500, Сумма: 1000 }
    - { Период: "2024-03-10T09:00:00", Регистратор: "Документ.РасходнаяНакладная:d3", ВидДвижения: Расход, Склад: s_east, Номенклатура: n1, Количество: 10,  Сумма: 5200 }
    # Плюс несколько условных «приходов» для демонстрации остатков
    - { Период: "2024-01-01T00:00:00", Регистратор: "нач-остатки",                     ВидДвижения: Приход, Склад: s_main, Номенклатура: n1, Количество: 100, Сумма: 45000 }
    - { Период: "2024-01-01T00:00:00", Регистратор: "нач-остатки",                     ВидДвижения: Приход, Склад: s_main, Номенклатура: n2, Количество: 50,  Сумма: 7000 }
    - { Период: "2024-01-01T00:00:00", Регистратор: "нач-остатки",                     ВидДвижения: Приход, Склад: s_main, Номенклатура: n3, Количество: 20,  Сумма: 22000 }
    - { Период: "2024-01-01T00:00:00", Регистратор: "нач-остатки",                     ВидДвижения: Приход, Склад: s_main, Номенклатура: n4, Количество: 1000, Сумма: 2800 }
    - { Период: "2024-01-01T00:00:00", Регистратор: "нач-остатки",                     ВидДвижения: Приход, Склад: s_main, Номенклатура: n5, Количество: 2000, Сумма: 3200 }
    - { Период: "2024-01-01T00:00:00", Регистратор: "нач-остатки",                     ВидДвижения: Приход, Склад: s_east, Номенклатура: n1, Количество: 50,  Сумма: 22500 }

  # ── РегистрСведений.ЦеныНоменклатуры ──────────────────────────
  # Периодический: цена на дату. `СрезПоследних(&Дата)` вернёт актуальную.

  РегистрСведений.ЦеныНоменклатуры:
    - { Период: "2024-01-01T00:00:00", Номенклатура: n1, Цена: 500 }
    - { Период: "2024-01-01T00:00:00", Номенклатура: n2, Цена: 150 }
    - { Период: "2024-01-01T00:00:00", Номенклатура: n3, Цена: 1200 }
    - { Период: "2024-01-01T00:00:00", Номенклатура: n4, Цена: 3 }
    - { Период: "2024-01-01T00:00:00", Номенклатура: n5, Цена: 2 }
    - { Период: "2024-03-01T00:00:00", Номенклатура: n1, Цена: 520 }  # цена выросла
    - { Период: "2024-03-01T00:00:00", Номенклатура: n5, Цена: 2.5 }
